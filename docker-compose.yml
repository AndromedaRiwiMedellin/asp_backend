services:
  db:
    image: postgres:16-alpine
    container_name: andromeda_db
    restart: unless-stopped
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-andromeda}
      POSTGRES_USER: ${DB_USER:-andromeda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superpassword}
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andromeda_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}${DB_CONN_SUFFIX:-}"
      Jwt__Issuer: ${JWT_ISSUER:-andromeda-api}
      Jwt__Audience: ${JWT_AUDIENCE:-andromeda-client}
      Jwt__Key: ${JWT_KEY:-super_secret_dev_key_change_me_2026}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andromeda_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
